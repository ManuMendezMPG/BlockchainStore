[/Script/Engine.GameUserSettings]
; Version debe coincidir con UE_GAMEUSERSETTINGS_VERSION (5 en UE 5.5).
; Sin esta linea, ValidateSettings() detecta version mismatch y llama a
; SetToDefaults(), que resetea FullscreenMode a WindowedFullscreen (borderless).
Version=5
; 0 = Fullscreen, 1 = WindowedFullscreen (borderless), 2 = Windowed
FullscreenMode=2
LastConfirmedFullscreenMode=2
PreferredFullscreenMode=2
ResolutionSizeX=1920
ResolutionSizeY=1080
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080
